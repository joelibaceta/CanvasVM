name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: canvas-vm
            asset_name: canvas-vm-linux-x86_64
            archive_name: canvas-vm-linux-x86_64.tar.gz
          
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: canvas-vm
            asset_name: canvas-vm-darwin-x86_64
            archive_name: canvas-vm-darwin-x86_64.tar.gz
          
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: canvas-vm
            asset_name: canvas-vm-darwin-aarch64
            archive_name: canvas-vm-darwin-aarch64.tar.gz
          
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: canvas-vm.exe
            asset_name: canvas-vm-windows-x86_64.exe
            archive_name: canvas-vm-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p canvas-cli
      
      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/canvas-vm
          strip target/${{ matrix.target }}/release/piet
          strip target/${{ matrix.target }}/release/pietc
      
      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../../../dist/${{ matrix.archive_name }} canvas-vm.exe piet.exe pietc.exe
          else
            tar czf ../../../dist/${{ matrix.archive_name }} canvas-vm piet pietc
          fi
      
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/${{ matrix.archive_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure of downloaded files
        run: ls -R artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
